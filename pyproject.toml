[project]
name = "stock-research"
version = "0.1.0"
description = "Backend Python phân tích chứng khoán Việt Nam qua BookFin FCData Gateway"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "redis",
    "httpx",
    "websockets",
    "numpy",
    "ta-lib==0.8.3",
    "raganything==1.4.4",
    "lightrag-hku==1.4.16",
    "pgvector==0.5.1",
    "openai==2.54.0",
    "python-multipart>=0.0.34",
    "pillow>=12.3.0",
    "tavily-python==0.8.5",
    "firecrawl-py==4.57.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "respx",
    "mypy>=2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]


# -------------------------
# Ruff
# -------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E4",   # Import errors
    "E7",   # Statement errors
    "E9",   # Runtime syntax errors
    "F",    # Pyflakes
    "I",    # Import sorting
    "B",    # Bugbear
    "UP",   # Modern Python syntax
    "SIM",  # Simplification
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


# -------------------------
# Pytest
# -------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: cần PostgreSQL, Redis hoặc dịch vụ ngoài đang chạy",
]

# Type-check the new provider-independent contracts and migrated service.
[tool.mypy]
files = [
    "src/app/indicators/engine.py",
    "src/app/indicators/native.py",
    "src/app/indicators/factory.py",
    "src/app/indicators/custom.py",
    "src/app/indicators/streaming.py",
    "src/app/services/indicator_service.py",
    "src/app/services/weekly_candles.py",
    "src/app/schemas/evidence.py",
    "src/app/schemas/analysis.py",
    "src/app/adapters/vision_adapter.py",
    "src/app/adapters/news_search_adapter.py",
    "src/app/adapters/tavily_adapter.py",
    "src/app/adapters/firecrawl_adapter.py",
    "src/app/adapters/rerank_adapter.py",
    "src/app/adapters/rag_anything_adapter.py",
    "src/app/services/rag_enrichment_service.py",
    "src/app/services/rag_query_service.py",
    "src/app/services/news_enrichment_service.py",
    "src/app/services/analysis_normalization_service.py",
    "src/app/services/technical_verification_service.py",
    "src/app/repositories/evidence_repository.py",
    "src/app/adapters/technical_evidence_adapter.py",
    "src/app/repositories/analysis_repository.py",
    "src/app/services/analysis_memory_service.py",
    "src/app/core/rag_runtime.py",
    "src/app/workers/rag_worker.py",
    "src/app/workers/engine.py",
    "src/app/workers/registry.py",
    "src/app/workers/locks.py",
    "src/app/workers/schedule.py",
    "src/app/workers/heartbeat.py",
    "src/app/workers/bootstrap.py",
    "src/app/workers/cli.py",
    "src/app/workers/jobs/common.py",
    "src/app/workers/jobs/ingestion.py",
    "src/app/workers/jobs/indicators.py",
    "src/app/workers/jobs/rag.py",
    "src/app/workers/roles/scheduler.py",
    "src/app/workers/roles/realtime.py",
]
check_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
